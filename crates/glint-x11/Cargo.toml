[package]
name = "glint-x11"
description = "Glint's X11 backends: capture, XTest injection, monitors, windows, hotkeys, picking"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
# Xvfb sandboxes for tests in other crates (glint-engine, glint-lab).
sandbox = []

[dependencies]
glint-core.workspace = true
rustix = { workspace = true, features = ["event", "net", "system"] }
thiserror.workspace = true
x11rb.workspace = true
x11rb-protocol.workspace = true

[lints]
workspace = true

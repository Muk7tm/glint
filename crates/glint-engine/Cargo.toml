signal-hook.workspace = true
thiserror.workspace = true
triple_buffer.workspace = true
x11rb.workspace = true

[dev-dependencies]
glint-x11 = { workspace = true, features = ["sandbox"] }
signal-hook.workspace = true

[lints]
workspace = true

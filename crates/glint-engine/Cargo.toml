[package]
name = "glint-engine"
description = "the Glint engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "glintd"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
assert_no_alloc.workspace = true
arc-swap.workspace = true
clap.workspace = true
glint-core.workspace = true
glint-ipc.workspace = true
glint-x11.workspace = true
rayon.workspace = true
rtrb.workspace = true
rustix = { workspace = true, features = ["fs", "net", "process"] }
serde_json.workspace = true
signal-hook.workspace = true
thiserror.workspace = true
triple_buffer.workspace = true
x11rb.workspace = true
zbus.workspace = true

[dev-dependencies]
clap.workspace = true
glint-ctl.workspace = true
glint-lab.workspace = true
glint-x11 = { workspace = true, features = ["sandbox"] }
rtrb.workspace = true
rustix = { workspace = true, features = ["process"] }
signal-hook.workspace = true

[lints]
workspace = true

# Builds every package in an Ubuntu 22.04 container, so the window needs no glibc newer than 2.35, and
# checks what each holds (PLAN §18, ADR 0022). The run keeps the three packages for 30 days, for the owner's
# GitHub releases (ADR 0021).
name: Packages

on:
  push:
    branches: [main]
    paths:
      - "packaging/**"
      - "assets/**"
      - "LICENSE"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/*/Cargo.toml"
      - ".github/workflows/packages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  packages:
    name: build and check the packages
    runs-on: ubuntu-24.04
    container: ubuntu:22.04
    steps:
      - name: Build tools, the window's libraries, and dpkg-deb and rpm for the checks
        env:
          DEBIAN_FRONTEND: noninteractive
        run: >-
          apt-get update && apt-get install -y --no-install-recommends
          ca-certificates curl git build-essential pkg-config libfontconfig-dev
          binutils file rpm desktop-file-utils
      - uses: actions/checkout@v7
      - name: Rust from rust-toolchain.toml, with the musl target
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - name: cargo-deb and cargo-generate-rpm
        run: cargo install --locked cargo-deb@3.8.0 cargo-generate-rpm@0.21.1
      - name: appimagetool
        run: |
          curl -fsSL -o /usr/local/bin/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /usr/local/bin/appimagetool
      - name: Build every package
        env:
          # No FUSE in a container: appimagetool, itself an AppImage, unpacks itself instead.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: packaging/build.sh --require
      - name: Check the window's glibc and what each package holds
        working-directory: dist
        run: |
          set -eu
          need="$(objdump -T stage/glint | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -n 1)"
          echo "The window needs $need"
          test "$(printf '%s\n' "$need" GLIBC_2.35 | sort -V | tail -n 1)" = GLIBC_2.35
          programs="usr/bin/glint usr/bin/glintd usr/bin/glint-ctl usr/bin/glint-lab
            usr/share/applications/glint.desktop usr/share/icons/hicolor/scalable/apps/glint.svg"
          # The installed packages also carry the optional systemd user unit; the AppImage doesn't.
          files="$programs usr/lib/systemd/user/glintd.service"
          dpkg-deb --info glint_*.deb
          dpkg-deb --contents glint_*.deb | tee deb.txt
          for f in $files usr/share/doc/glint/copyright; do grep -q " \./$f\$" deb.txt; done
          rpm -qip glint-*.rpm
          rpm -qlp glint-*.rpm | tee rpm.txt
          for f in $files usr/share/licenses/glint/LICENSE; do grep -qx "/$f" rpm.txt; done
          ./Glint-*-x86_64.AppImage --appimage-extract > /dev/null
          for f in $programs usr/share/licenses/glint/LICENSE LICENSE glint.desktop glint.svg AppRun; do
            test -e "squashfs-root/$f" || { echo "missing in the AppImage: $f"; exit 1; }
          done
          desktop-file-validate squashfs-root/glint.desktop
          squashfs-root/AppRun --version
          squashfs-root/AppRun glintd --version
          squashfs-root/AppRun glint-ctl --version
          squashfs-root/AppRun glint-lab --version
      - name: Keep the packages for a release
        uses: actions/upload-artifact@v7
        with:
          name: glint-packages
          path: |
            dist/Glint-*-x86_64.AppImage
            dist/glint_*.deb
            dist/glint-*.rpm
          if-no-files-found: error
          retention-days: 30
